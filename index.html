<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP CSP｜12 題清晰版練習</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#1b2b44;background:#f3f5fa;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif}main{max-width:940px;margin:36px auto;padding:0 20px}.eyebrow{font-size:12px;color:#5365cc;letter-spacing:2px;font-weight:750}h1{font-size:30px;margin:12px 0}header p{color:#627087;line-height:1.8}.stats{display:flex;justify-content:space-between;gap:12px;margin-top:24px;font-size:14px;font-weight:650}.track{height:7px;border-radius:8px;background:#dfe5f0;margin:14px 0 24px;overflow:hidden}#fill{height:100%;background:#5365cc;transition:width .2s}.card{padding:30px;background:white;border-radius:20px;border:1px solid #e1e6ef;box-shadow:0 8px 30px #25386608}.meta{font-size:13px;color:#687790;margin-bottom:18px}.stem{font-size:18px;line-height:1.85;overflow-wrap:anywhere}.algorithm{border-left:3px solid #bdc8ef;background:#f6f8fd;margin:16px 0;padding:14px 18px}.stem li{padding-left:4px;margin:8px 0}table{border-collapse:collapse;margin:20px 0;width:100%;font-size:16px}th,td{border:1px solid #dce2ee;padding:9px 14px;text-align:left}th{background:#f4f6fc}.choices{display:grid;gap:12px;margin:24px 0}.choice{display:flex;gap:14px;text-align:left;align-items:baseline;background:white;border:1px solid #ccd5e4;border-radius:13px;padding:17px 18px;width:100%;font:inherit;font-size:16px;line-height:1.7;color:inherit;cursor:pointer}.letter{display:inline-flex;justify-content:center;align-items:center;flex-shrink:0;width:28px;height:28px;border-radius:8px;background:#f0f3fa;font-weight:750}.choice:hover:enabled{border-color:#5365cc;background:#f7f8ff}button:focus-visible{outline:3px solid #a8b5f5;outline-offset:3px}.correct{background:#eaf8ef!important;border-color:#379061!important;color:#176039}.wrong{background:#fff0ee!important;border-color:#c85b51!important;color:#943d32}.choice:disabled{cursor:default;opacity:1}#feedback{padding:18px;border-radius:12px;line-height:1.8}#feedback:empty{display:none}#feedback p{margin:6px 0 0}.navigation{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.nav{font:inherit;font-weight:650;border-radius:11px;border:1px solid #ccd5e4;background:white;color:#263650;padding:13px 20px;cursor:pointer}.primary{background:#4259c7;color:white;border-color:#4259c7}.nav:disabled{opacity:.4;cursor:default}#result{text-align:center}#grade{font-size:68px;font-weight:800;color:#4259c7;margin:18px 0}.breakdown{line-height:1.9;color:#627087}#review{text-align:left;margin-top:26px}.review-item{padding:16px 0;border-top:1px solid #e1e6ef;line-height:1.8}.review-item p{margin:8px 0}.note{font-size:12px;color:#7a869a;line-height:1.8;margin:22px 0}[hidden]{display:none!important}@media(max-width:600px){main{margin:22px auto;padding:0 12px}.card{padding:20px 16px}h1{font-size:25px}.stem{font-size:17px}.choice{padding:14px 12px;font-size:16px;gap:10px}.stats{font-size:12px}.nav{padding:12px 15px}.algorithm{padding:12px}.stem ol,.stem ul{padding-left:22px}}
</style></head><body><main><header><div class="eyebrow">AP COMPUTER SCIENCE PRINCIPLES</div><h1>12 題，練出清晰思路。</h1><p>清晰文字版 · 每題四選一 · 作答後立即顯示答案<br>100 分起算，每錯一題扣 8 分。完成 12 題後顯示總分。</p></header>
<div class="stats"><span id="progress"></span><span id="status"></span></div><div class="track"><div id="fill"></div></div>
<section class="card" id="quiz" aria-label="題目"><div class="meta" id="meta"></div><div class="stem" id="stem" lang="en"></div><div class="choices" role="group" aria-label="四個答案選項"></div><div id="feedback" role="status" aria-live="polite"></div><div class="navigation"><button class="nav" id="prev">← 上一題</button><button class="nav primary" id="next">下一題 →</button></div></section>
<section class="card" id="result" hidden><div class="eyebrow">PRACTICE COMPLETE</div><h2>練習完成</h2><div id="grade"></div><p id="breakdown" class="breakdown"></p><button class="nav primary" id="restart">重新練習</button><div id="review"></div></section>
<p class="note">來源：SG_Quiz32、SG_Quiz33、SG_Quiz34、SG_Quiz4 答案 PDF，各選 3 題。英文題意與選項依原題重新排版，部分長句與步驟精簡；答案依原檔核對。解析為補充說明。文字與表格可隨瀏覽器放大，無需連線即可使用。</p></main>
<script>
const questions=[{"source": "Quiz 3-2", "number": 6, "stem": "A student is creating an algorithm to display the distance between the numbers num1 and num2 on a number line. The following table shows the distance for several different values.\n<table><thead><tr><th>num1<\/th><th>num2<\/th><th>Distance<\/th><\/tr><\/thead><tbody><tr><td>5<\/td><td>2<\/td><td>3<\/td><\/tr><tr><td>1<\/td><td>8<\/td><td>7<\/td><\/tr><tr><td>−3<\/td><td>4<\/td><td>7<\/td><\/tr><\/tbody><\/table>\nWhich of the following algorithms displays the correct distance for all possible values of num1 and num2?", "options": ["Add num1 and num2 and store the result in sum. Take the absolute value of sum and display the result.", "Subtract num1 from num2 and store the result in diff. Take the absolute value of diff and display the result.", "Take the absolute value of num1 and store it in absNum1. Take the absolute value of num2 and store it in absNum2. Add absNum1 and absNum2 and display the result.", "Take the absolute value of num1 and store it in absNum1. Take the absolute value of num2 and store it in absNum2. Subtract absNum1 from absNum2 and display the result."], "answer": "B", "explanation": "數線上兩數的距離為 |num2 − num1|，差的絕對值永遠不會是負數。"}, {"source": "Quiz 3-2", "number": 7, "stem": "A certain game keeps track of the maximum and minimum scores obtained so far. If num represents the most recent score obtained, which of the following algorithms correctly updates the values of the maximum and the minimum?", "options": ["If num is greater than the minimum, set the minimum equal to num. Otherwise, if num is greater than the maximum, set the maximum equal to num.", "If num is less than the minimum, set the minimum equal to num. Otherwise, if num is greater than the maximum, set the maximum equal to num.", "If num is less than the minimum, set the minimum equal to num. Otherwise, if num is less than the maximum, set the maximum equal to num.", "If num is greater than the minimum, set the minimum equal to num. Otherwise, if num is less than the maximum, set the maximum equal to num."], "answer": "B", "explanation": "新分數比目前最小值小才更新最小值；比目前最大值大才更新最大值。"}, {"source": "Quiz 3-2", "number": 8, "stem": "A programmer is creating an algorithm that will be used to turn on the motor to open the gate in a parking garage. The specifications are as follows.\n<ul><li>The gate should not open when the time is outside of business hours.<\/li><li>The motor should not turn on unless the gate sensor is activated.<\/li><li>The motor should not turn on if the gate is already open.<\/li><\/ul>\nWhich of the following algorithms can be used to open the gate under the appropriate conditions?", "options": ["Check if the time is outside of business hours. If it is, check if the gate sensor is activated. If it is, check if the gate is closed. If it is, turn on the motor.", "Check if the time is during business hours. If it is, check if the gate sensor is activated. If it is, check if the gate is open. If it is, turn on the motor.", "Check if the time is during business hours. If it is, check if the gate sensor is activated. If it is not, check if the gate is open. If it is not, turn on the motor.", "Check if the time is during business hours. If it is, check if the gate sensor is activated. If it is, check if the gate is closed. If it is, turn on the motor."], "answer": "D", "explanation": "三個條件必須同時成立：營業時間內、感測器已啟動，而且門目前關閉。"}, {"source": "Quiz 3-3", "number": 6, "stem": "Suppose a large group of people in a room were all born in the same year. Each of the following algorithms is intended to identify the people with the earliest birthday, based on month and day. For example, February 10 is earlier than March 5. Which algorithms will identify the correct people?\n<div class=\"algorithm\"><b>I.<\/b> Everyone stands. Standing people form pairs where possible. In each pair, the person with the earlier birthday remains standing and the other sits down; if tied, both sit down. An unpaired person remains standing. Repeat until one person remains; identify that person.<\/div>\n<div class=\"algorithm\"><b>II.<\/b> Everyone stands. Standing people form pairs with someone they have not previously been paired with where possible. In each pair, the person with the earlier birthday remains standing and the other sits down; if tied, both remain standing. An unpaired person remains standing. Repeat until only one person remains or all standing people have the same birthday; identify everyone still standing.<\/div>\n<div class=\"algorithm\"><b>III.<\/b> Starting with 1, ask if anyone was born on that day of any month. Increase the day until someone responds. If one person responds, identify that person; otherwise identify the responder(s) born in the earliest month.<\/div>", "options": ["I only", "II only", "I and II", "II and III"], "answer": "B", "explanation": "演算法 I 可能把最早生日相同的人全部淘汰；III 先比較日、再比較月，可能誤判。只有 II 能保留所有最早生日的人。"}, {"source": "Quiz 3-3", "number": 9, "stem": "The following algorithm simulates flipping a coin 4 times. Consider the goal of determining whether the simulation resulted in an equal number of heads and tails.\n<ol><li>Initialize heads_counter and flip_counter to 0.<\/li><li>Randomly assign coin_flip either 0 or 1. If coin_flip is 0, the result is heads, so increment heads_counter by 1.<\/li><li>Increment flip_counter by 1.<\/li><li>Repeat steps 2 and 3 until flip_counter equals 4.<\/li><\/ol>\nFollowing execution of the algorithm, which expression indicates an equal number of heads and tails?", "options": ["coin_flip = 1", "flip_counter = 1", "flip_counter = 2", "heads_counter = 2"], "answer": "D", "explanation": "總共擲 4 次，正反面一樣多就表示各 2 次，因此 heads_counter 必須等於 2。"}, {"source": "Quiz 3-3", "number": 14, "stem": "The following algorithm is intended to determine the average height, in centimeters, of a group of people. Each person has a card, a pencil, and an eraser. Step 2 is missing.\n<ol><li>All people stand up.<\/li><li>(missing step)<\/li><li>Standing people form pairs. An unpaired person remains standing and waits until the next opportunity to form pairs.<\/li><li>In each pair, one person hands their card to the other person and sits down.<\/li><li>The standing person replaces the top number on their card with the sum of the top numbers on both cards, and the bottom number with the sum of the bottom numbers. The sitting partner’s card is discarded.<\/li><li>Repeat steps 3–5 until only one person is standing.<\/li><li>The last person divides the top number by the bottom number to determine the average height.<\/li><\/ol>\nWhich of the following can be used as step 2 so that the algorithm works as intended?", "options": ["Each person writes their height, in centimeters, at the top of the card and writes the number 1 at the bottom.", "Each person writes their height, in centimeters, at the top of the card and writes the number 2 at the bottom.", "Each person writes the number 1 at the top of the card and writes their height, in centimeters, at the bottom.", "Each person writes the number 2 at the top of the card and writes their height, in centimeters, at the bottom."], "answer": "A", "explanation": "上方累加所有人的身高，下方累加人數（每人 1），最後以身高總和除以總人數。"}, {"source": "Quiz 3-4", "number": 5, "stem": "Three different numbers need to be placed in order from least to greatest. For example, 9, 16, 4 should be reordered as 4, 9, 16. Which algorithm can place any three numbers in the correct order?", "options": ["If the first number is greater than the last number, swap them. Then, if the first number is greater than the middle number, swap them.", "If the first number is greater than the middle number, swap them. Then, if the middle number is greater than the last number, swap them.", "If the first number is greater than the middle number, swap them. Then, if the middle number is greater than the last number, swap them. Then, if the first number is greater than the last number, swap them.", "If the first number is greater than the middle number, swap them. Then, if the middle number is greater than the last number, swap them. Then, if the first number is greater than the middle number, swap them."], "answer": "D", "explanation": "依序比較第 1、2 個，第 2、3 個，再比較第 1、2 個，能讓三個不同數字由小排到大。"}, {"source": "Quiz 3-4", "number": 6, "stem": "An algorithm will identify the maximum value in a list of one or more integers. Consider these versions:\n<div class=\"algorithm\"><b>Algorithm I:<\/b> Set max to −1. Iterate through the list. If a data value is greater than max, set max to that data value.<\/div>\n<div class=\"algorithm\"><b>Algorithm II:<\/b> Set max to the first data value. Iterate through the remaining values. If a data value is greater than max, set max to that data value.<\/div>\nWhich statement best describes the behavior of the two algorithms?", "options": ["Both algorithms work correctly on all input values.", "Algorithm I always works correctly, but Algorithm II only works correctly when the maximum value is not the first value in the list.", "Algorithm II always works correctly, but Algorithm I only works correctly when the maximum value is greater than or equal to −1.", "Neither algorithm will correctly identify the maximum value when the input contains both positive and negative input values."], "answer": "C", "explanation": "如果全部數字都小於 −1，演算法 I 會錯誤保留 −1。以第一個元素作為初始最大值，則能處理所有整數清單。"}, {"source": "Quiz 3-4", "number": 7, "stem": "A programmer is deciding between using a linear or binary search to find a target value in a sorted list. Which of the following is true?", "options": ["In all cases, a binary search of a sorted list requires fewer comparisons than a linear search.", "Generally, the advantage of using a binary search over a linear search increases as the size of the list increases.", "A linear search will generally run faster than a binary search because a linear search requires fewer lines of code to implement.", "Using a linear search is preferable to using a binary search if there is a chance that the target may not be found in the list."], "answer": "B", "explanation": "二分搜尋每次把範圍減半；清單越大，相較逐項檢查的線性搜尋，通常越有優勢。"}, {"source": "Quiz 4", "number": 3, "stem": "According to the domain name system (DNS), which of the following is a subdomain of the domain example.com?", "options": ["about.example.com", "example.co.uk", "example.com.org", "example.org"], "answer": "A", "explanation": "子網域加在原網域左側，因此 about.example.com 是 example.com 的子網域。"}, {"source": "Quiz 4", "number": 5, "stem": "A computer has two processors that can run in parallel. The table shows the time either processor takes to execute four independent processes.\n<table><thead><tr><th>Process<\/th><th>Execution time<\/th><\/tr><\/thead><tbody><tr><td>W<\/td><td>20 seconds<\/td><\/tr><tr><td>X<\/td><td>30 seconds<\/td><\/tr><tr><td>Y<\/td><td>45 seconds<\/td><\/tr><tr><td>Z<\/td><td>50 seconds<\/td><\/tr><\/tbody><\/table>\nHow should the program assign the four processes to optimize execution time?", "options": ["Assign W and X to one processor, and Y and Z to the other.", "Assign W and Y to one processor, and X and Z to the other.", "Assign W and Z to one processor, and X and Y to the other.", "Assign Z to one processor, and W, X, and Y to the other."], "answer": "C", "explanation": "W + Z = 70 秒，X + Y = 75 秒，整體在 75 秒完成，比其他分配方式更快。"}, {"source": "Quiz 4", "number": 12, "stem": "A computer has two identical processors that can run in parallel. The table shows how long either processor takes to execute two independent processes.\n<table><thead><tr><th>Process<\/th><th>Execution time<\/th><\/tr><\/thead><tbody><tr><td>P<\/td><td>30 seconds<\/td><\/tr><tr><td>Q<\/td><td>45 seconds<\/td><\/tr><\/tbody><\/table>\nWhat is the approximate difference in execution time between running the processes in parallel and running them one after the other on a single processor?", "options": ["15 seconds", "30 seconds", "45 seconds", "75 seconds"], "answer": "B", "explanation": "依序執行需 30 + 45 = 75 秒；平行執行需 45 秒，因此節省 30 秒。"}];
const letters='ABCD';let current=0;let answers=Array(questions.length).fill(null);const $=id=>document.getElementById(id);
function totals(){const answered=answers.filter(a=>a!==null).length;const correct=answers.filter((a,i)=>a===questions[i].answer).length;return {answered,correct,wrong:answered-correct,score:100-8*(answered-correct)}}
function render(){const q=questions[current],a=answers[current],t=totals();$('quiz').hidden=false;$('result').hidden=true;$('progress').textContent=`第 ${current+1} / ${questions.length} 題`;$('status').textContent=`已答 ${t.answered} 題 · 答對 ${t.correct} 題`;$('fill').style.width=`${t.answered/questions.length*100}%`;$('meta').textContent=`${q.source} · 原題第 ${q.number} 題`;$('stem').innerHTML=q.stem;document.querySelector('.choices').replaceChildren();for(let i=0;i<4;i++){const b=document.createElement('button');b.className='choice';b.lang='en';b.disabled=a!==null;b.setAttribute('aria-label',`選項 ${letters[i]}：${q.options[i]}`);const letter=document.createElement('span');letter.className='letter';letter.textContent=letters[i];const text=document.createElement('span');text.textContent=q.options[i];b.append(letter,text);if(a!==null){if(letters[i]===q.answer)b.classList.add('correct');else if(letters[i]===a)b.classList.add('wrong')}b.onclick=()=>{answers[current]=letters[i];render();$('feedback').scrollIntoView({block:'nearest',behavior:'smooth'})};document.querySelector('.choices').append(b)}$('feedback').replaceChildren();$('feedback').className='';if(a!==null){const ok=a===q.answer;$('feedback').className=ok?'correct':'wrong';const strong=document.createElement('strong');strong.textContent=ok?`✓ 答對了！正確答案：${q.answer}`:`✕ 你選了 ${a}，正確答案：${q.answer}。本題扣 8 分。`;const p=document.createElement('p');p.textContent=q.explanation;$('feedback').append(strong,p)}$('prev').disabled=current===0;$('next').disabled=a===null;$('next').textContent=current===questions.length-1?'查看分數 →':'下一題 →'}
function finish(){const t=totals();if(t.answered!==questions.length)return;$('quiz').hidden=true;$('result').hidden=false;$('progress').textContent='已完成全部 12 題';$('grade').textContent=`${t.score} 分`;$('breakdown').textContent=`答對 ${t.correct} 題，答錯 ${t.wrong} 題。100 − ${t.wrong} × 8 = ${t.score} 分。`;$('review').replaceChildren();const title=document.createElement('h3');title.textContent=t.wrong?'錯題回顧':'全部答對，表現出色！';$('review').append(title);questions.forEach((q,i)=>{if(answers[i]===q.answer)return;const item=document.createElement('div');item.className='review-item';const label=document.createElement('strong');label.textContent=`第 ${i+1} 題 · ${q.source} 原題 ${q.number}`;const p=document.createElement('p');p.textContent=`你的答案：${answers[i]}；正確答案：${q.answer} — ${q.options[letters.indexOf(q.answer)]}`;const e=document.createElement('p');e.textContent=q.explanation;item.append(label,p,e);$('review').append(item)})}
$('next').onclick=()=>{if(answers[current]===null)return;if(current<questions.length-1){current++;render()}else finish();window.scrollTo(0,0)};$('prev').onclick=()=>{if(current>0){current--;render();window.scrollTo(0,0)}};$('restart').onclick=()=>{current=0;answers.fill(null);render();window.scrollTo(0,0)};render();
</script></body></html>
